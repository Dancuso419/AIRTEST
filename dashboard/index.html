  <body>
    <!--
      THESIS: AIREST is a technical plate, not a dashboard. Six drafted dials,
      each owning one truth, each carrying BOTH standards on one scale so the
      gap between needles is the reading. Refuses the KPI-tile arrangement and
      refuses the photographed-hardware look it replaced.
      OWN-WORLD: Swiss technical on cream #faf8f4. Hairline rules do the
      structural work; every region is bounded by a 1px rule rather than a
      card. Ink #16181d and blue #1b3fa0 carry the two standards as an equal
      pair - neither is a warning colour, because a comparison must not
      editorialise its result. Amber #a35a06 is reserved for dataset caveats.
      Archivo for type, JetBrains Mono for measured stamps, tabular figures
      everywhere.
      STORY: The visitor sets the room, engages, and watches ten seconds of
      replay drive the needles from the run's own recorded samples. They leave
      knowing what one student gets, and that it was computed earlier.
      FIRST VIEWPORT: Rule under the masthead. Conditions column left of a
      vertical rule; instrument cluster right, 3x2 in a hairline grid, with the
      verdict above it and the replay transport between.
      FORM: Night instrument six-pack reinterpreted as a drafted plate on
      cream, at the user's direction. Seed key 09b6f6e4.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
