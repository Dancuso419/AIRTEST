  <body>
    <!--
      THESIS: AIREST is an instrument panel, not a dashboard. Six dials, each
      owning one truth, each carrying BOTH standards on one scale so the
      comparison is the reading itself. It refuses the analytics arrangement
      it shipped as before: white cards on grey, KPI tiles, a form of stacked
      selects.
      OWN-WORLD: Panel black #0B0D0F with anti-reflective instrument faces,
      satin bezels with visible fasteners, luminous white markings, radium
      green #7CFF9E for the WiFi 6 needle, caution amber #FFB000 reserved for
      dataset caveats and nothing else. Saira for instrument numerals and
      placards, JetBrains Mono for body. Every label sits in a bordered
      placard box.
      STORY: The visitor sets the room, engages, and sweeps six dials in a
      fixed order. White needle is WiFi 5, green needle is WiFi 6; where they
      separate is the finding. They leave knowing what one student gets.
      FIRST VIEWPORT: Full-bleed panel. Masthead left with AIREST and the
      condition placards; instrument cluster right, two ranked rows of three,
      bezelled and screwed to the panel. ENGAGE sits under the conditions,
      its provenance placard permanently beneath it.
      FORM: Night instrument six-pack, candidate 5 of 7 on the grounded list,
      chosen by the user over the assigned Site Survey. Seed key 09b6f6e4.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
